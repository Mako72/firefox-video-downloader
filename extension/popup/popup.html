<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body class="pop">
  <header class="topbar">
    <img src="../icons/icon.svg" alt="" class="logo">
    <h1>Video-Downloader</h1>
    <button id="deep" class="ibtn" title="Tiefensuche – Seite gründlich nach versteckten Videos durchsuchen">🔍</button>
    <button id="side" class="ibtn" title="Downloads in der Seitenleiste (Alt+Umschalt+V)">⬇</button>
    <button id="gear" class="ibtn" title="Einstellungen">⚙</button>
  </header>
  <section id="settings" class="settings" hidden></section>
  <div id="notice" class="notice" hidden></div>
  <ul id="list" class="rows"></ul>
  <footer class="foot">
    <span id="count"></span>
    <button id="openSide" class="linkbtn">Seitenleiste öffnen</button>
  </footer>
  <div id="menu" class="menu" hidden></div>
  <script src="../settings.js"></script>
  <script src="../ui-common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
